<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Регистрация героя · Солёная Мгла</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: мастер создания героя — узкая колонка, сверху «Мои герои», ниже шаги 1–7 чипами, карточка шага и кнопки «Назад / Далее». Тёмный образ, как у игрового стола. */
:root{
  --bg:#0a0e0f; --panel:#111819; --panel2:#162022; --ink:#e3ebe8; --muted:#8e9e9b; --line:#243235;
  --sea:#8fd1c4; --brass:#d9b36c; --danger:#e58a80; --ok:#8fcf8a;
  --f-display:"Alegreya SC", Georgia, serif;
  --f-body:"Alegreya Sans", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 80px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sea)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:4px 0 0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0 0 8px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:500;font-size:19px;margin:16px 0 6px}
a{color:var(--sea)}
.go{font-family:var(--f-mono);font-size:14px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px;margin:14px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 14px;cursor:pointer}
.btn:hover,.btn:focus-visible{border-color:var(--sea);outline:none}
.btn.pri{border-color:rgba(217,179,108,.6);color:var(--brass)}
.btn.bad{border-color:rgba(229,138,128,.5);color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
input[type=text],input[type=number],select,textarea{background:#0c1213;border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sea)}
input[type=color]{width:52px;height:38px;border:1px solid var(--line);border-radius:8px;background:#0c1213;padding:2px}
textarea{resize:vertical}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.f>span{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}
.steps button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--muted);font-size:14px}
.steps button[aria-current="step"]{border-color:var(--brass);color:var(--brass)}
.steps button.done{color:var(--ink)}
.steps button:focus-visible{outline:2px solid var(--sea)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 11px;cursor:pointer}
.opt b{display:block;font-weight:700}
.opt span{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--brass);background:#231d10}
.opt:focus-visible{outline:2px solid var(--sea)}
.info{border-left:3px solid var(--sea);padding:6px 0 6px 12px;margin:12px 0;font-size:15px}
.info ul{margin:4px 0;padding-left:18px}
.info li{margin:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--panel2);cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--sea);color:var(--sea);background:#10292a}
.chip:disabled{opacity:.4;cursor:default}
.chip.fixed{border-color:rgba(217,179,108,.5);color:var(--brass);cursor:default}
.abil{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:8px}
.ab{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel2);text-align:center}
.ab b{display:block;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.ab .tot{font-family:var(--f-mono);font-size:22px}
.ab .md{font-family:var(--f-mono);font-size:13px;color:var(--sea)}
.ab select,.ab input{text-align:center;margin:4px 0}
.warn{color:var(--danger);font-size:14px}
.okc{color:var(--ok);font-size:14px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,110px),1fr));gap:8px}
.big{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;background:var(--panel2)}
.big b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.big span{font-family:var(--f-mono);font-size:22px}
.hero{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--panel2);flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;flex:0 0 auto;border:2px solid var(--brass)}
.hero .nm{flex:1;min-width:140px}
.code{font-family:var(--f-mono);font-size:12px;word-break:break-all;width:100%}
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#231d10;border:1px solid rgba(217,179,108,.6);color:var(--brass);border-radius:9px;padding:8px 14px;max-width:calc(100% - 32px);z-index:9}
pre.notes{white-space:pre-wrap;font-family:var(--f-body);font-size:14px;color:var(--muted);margin:0}
.pp{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:6px}
.pp button{display:grid;justify-items:center;gap:3px;padding:6px 2px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);cursor:pointer;font-size:11px;color:var(--muted);line-height:1.15}
.pp button[aria-pressed="true"]{border-color:var(--brass);color:var(--ink);background:#231d10}
.pp .ava{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #d9b36c}
.pp .ava img{width:32px;height:32px}
.ava-sm{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:2px solid #d9b36c;flex:0 0 auto}
.ava-sm img{width:20px;height:20px}
</style>
</head>

/* ================= мои герои, код, импорт ================= */
const heroes=()=>LS.get('smgla-heroes',[]);
function saveHero(quiet){const p=problems();if(p.length&&!quiet){toast('Сначала исправьте: '+p[0]);return false}if(p.length&&quiet){toast('Герой ещё не готов: '+p[0]);return false}
  const hero=build();const list=heroes().filter(x=>x.id!==hero.id);list.push(hero);if(!LS.set('smgla-heroes',list)){toast('Браузер не дал сохранить — скачайте JSON или скопируйте код.');return true}
  const drafts=LS.get('smgla-drafts',{});drafts[hero.id]=H;LS.set('smgla-drafts',drafts);if(!quiet)toast('Герой «'+hero.name+'» сохранён');renderMine();return true}

    h('button',{class:'btn sm',type:'button',onclick:()=>download(x)},'JSON'),
    h('button',{class:'btn sm bad',type:'button',onclick:e=>{const b=e.currentTarget;if(b.dataset.arm){LS.set('smgla-heroes',heroes().filter(y=>y.id!==x.id));const d=LS.get('smgla-drafts',{});delete d[x.id];LS.set('smgla-drafts',d);renderMine();toast('Герой удалён')}else{b.dataset.arm='1';b.textContent='Точно удалить?';setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent='Удалить'}},4000)}}},'Удалить')));

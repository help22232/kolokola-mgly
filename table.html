<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Стол Солёной Мглы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: игровой стол — карта на всю ширину слева, справа (на телефоне снизу) панель с вкладками: бой, герой, вещи, кубики, мастер, правила. Один тёмный образ, как ночная таверна: карта должна быть главной. */
:root{
  --bg:#0a0e0f; --panel:#111819; --panel2:#162022; --ink:#e3ebe8; --muted:#8e9e9b; --line:#243235;
  --sea:#8fd1c4; --brass:#d9b36c; --danger:#e58a80; --ok:#8fcf8a; --warn:#e8c46a;
  --f-display:"Alegreya SC", Georgia, serif;
  --f-body:"Alegreya Sans", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:15px;line-height:1.4;overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);}
header.top{display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
header .ttl{font-family:var(--f-display);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
header .chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
header .chip.gm{color:var(--brass);border-color:rgba(217,179,108,.5)}
header .chip.round{color:var(--danger);border-color:rgba(229,138,128,.5)}
header .sp{flex:1}
.peers{display:flex;gap:-4px}
.peers img{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);margin-left:-6px;background:#333}
.main{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0}
.board{position:relative;min-width:0;min-height:0;background:#050707;touch-action:none;overflow:hidden}
.board canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.board canvas.tool{cursor:crosshair}
.tools{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.tools button,.zoom button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:rgba(17,24,25,.9);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.tools button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:#231d10}
.tools button:focus-visible,.zoom button:focus-visible{outline:2px solid var(--sea)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:2}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(17,24,25,.92);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted);z-index:2;max-width:calc(100% - 120px);text-align:center}
.banner{position:absolute;left:10px;right:10px;bottom:56px;background:rgba(35,29,16,.95);border:1px solid rgba(217,179,108,.5);color:var(--brass);border-radius:8px;padding:6px 10px;font-size:13px;z-index:2}
aside.panel{display:grid;grid-template-rows:auto minmax(0,1fr);border-left:1px solid var(--line);background:var(--panel);min-height:0;min-width:0}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{flex:0 0 auto;padding:10px 12px;border:0;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.tabs button:focus-visible{outline:2px solid var(--sea);outline-offset:-2px}
.pane{overflow:auto;padding:12px 14px 40px;min-height:0}
h3{font-family:var(--f-display);font-weight:500;font-size:19px;margin:14px 0 6px}
h3:first-child{margin-top:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover,.btn:focus-visible{border-color:var(--sea);outline:none}
.btn.pri{border-color:rgba(217,179,108,.6);color:var(--brass)}
.btn.bad{border-color:rgba(229,138,128,.5);color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
input[type=text],input[type=number],select,textarea{background:#0c1213;border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
input[type=number]{width:64px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sea)}
textarea{width:100%;resize:vertical}
label.f{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);margin:8px 0}
.ini{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:9px;margin:5px 0;cursor:pointer;background:var(--panel2)}
.ini.cur{border-color:var(--brass);background:#231d10}
.ini .n{font-family:var(--f-mono);font-size:15px;text-align:center;color:var(--brass);font-variant-numeric:tabular-nums}
.ini .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ini .sub{font-size:12px;color:var(--muted)}
.hpbar{height:5px;border-radius:3px;background:#2a1a18;overflow:hidden;margin-top:3px}
.hpbar i{display:block;height:100%}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.stat{border:1px solid var(--line);border-radius:8px;text-align:center;padding:5px 2px;background:#0c1213;cursor:pointer}
.stat b{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.05em}
.stat input{width:100%;text-align:center;border:0;background:none;padding:2px 0;font-size:16px}
.stat .md{font-family:var(--f-mono);font-size:12px;color:var(--sea)}
.tag{display:inline-block;font-size:12px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);margin:2px;cursor:pointer;color:var(--muted)}
.tag[aria-pressed="true"]{color:var(--danger);border-color:rgba(229,138,128,.6)}
.log{display:flex;flex-direction:column;gap:6px}
.msg{border-left:3px solid var(--line);padding:3px 0 3px 8px}
.msg.roll{border-left-color:var(--sea)}
.msg.secret{border-left-color:var(--brass);background:#1b170d}
.msg.sys{border-left-color:var(--muted);color:var(--muted)}
.msg .who{font-size:12px;color:var(--muted)}
.msg .tot{font-family:var(--f-mono);font-size:18px;color:var(--ink)}
.msg .det{font-family:var(--f-mono);font-size:12px;color:var(--muted);word-break:break-word}
.dice{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dice button{padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-family:var(--f-mono)}
.inv td,.inv th{padding:4px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.inv th{font-size:11px;color:var(--muted);font-weight:500}
.inv{width:100%;border-collapse:collapse}
.ai-a{white-space:pre-wrap;line-height:1.5}
.ai-q{color:var(--brass);margin-top:12px;font-weight:500}
.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
.pp{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:6px}
.pp button{display:grid;justify-items:center;gap:3px;padding:6px 2px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);cursor:pointer;font-size:11px;color:var(--muted);line-height:1.15}
.pp button[aria-pressed="true"]{border-color:var(--brass);color:var(--ink);background:#231d10}
.pp .ava{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #d9b36c}
.pp .ava img{width:30px;height:30px}
details>summary{cursor:pointer;color:var(--sea);margin-top:8px}
.credit{font-size:11px;color:var(--muted);margin-top:18px}
@media (max-width:820px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,56fr) minmax(0,44fr)}
  aside.panel{border-left:0;border-top:1px solid var(--line)}
  header .ttl{font-size:16px}
  .hide-m{display:none}
}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="ttl" id="ttl">Колокола Солёной Мглы</div>
    <span class="chip hide-m" id="mapChip">—</span>
    <span class="chip round" id="roundChip" hidden>Раунд 1</span>
    <span class="sp"></span>

  <div class="main">
    <section class="board" id="board">

        <button type="button" data-tool="light" title="Источник света (клик)">💡</button>

      <div class="hint" id="hint" hidden></div>
      <div class="banner" id="banner" hidden></div>
      <div class="zoom">
        <button type="button" id="zoomOut" title="Отдалить">−</button>

    <aside class="panel">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="pane" id="pane"></div>
    </aside>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

const fire=p=>{(dl.get(p)||[]).forEach(f=>f());(cl.get(colOf(p))||[]).forEach(f=>f())};
const fireAll=()=>{dl.forEach(s=>s.forEach(f=>f()));cl.forEach(s=>s.forEach(f=>f()))};
const addL=(m,k,f)=>{if(!m.has(k))m.set(k,new Set());m.get(k).add(f);return()=>m.get(k).delete(f)};
const isPrivate=p=>p.startsWith('gm/');
const okPath=p=>typeof p==='string'&&/^(tokens|chars|log|maps)\/[A-Za-z0-9_\-]{1,40}$|^game\/state$/.test(p);
function applyOp(op,p,d){if(op==='set')docs.set(p,clone(d));else if(op==='update'){if(!docs.has(p))return false;docs.set(p,merge(docs.get(p),clone(d)))}else if(op==='del')docs.delete(p);else return false;fire(p);return true}

/* сеть */
const SAVE_KEY='smgla-room-'+ROOM;
let peer=null,hostConn=null,myPeer=isOwner?'host':null;const conns=new Map();
let saveT=0;function persist(){clearTimeout(saveT);saveT=setTimeout(()=>{if(!LSx.set(SAVE_KEY,Object.fromEntries(docs)))netStatus('Браузер не даёт сохранить игру (память переполнена). Удалите свои карты-картинки или очистите журнал.')},500)}
function bcast(msg){for(const c of conns.values())if(c.conn.open)try{c.conn.send(msg)}catch(e){}}
let netMsg='';function netStatus(t){netMsg=t;try{showBanner(t)}catch(e){}}
function write(op,p,d){
  if(isOwner){if(!applyOp(op,p,d))return;persist();if(!isPrivate(p))bcast({t:'doc',p,d:docs.has(p)?docs.get(p):null});return}
  if(!hostConn||!hostConn.open){netStatus('Нет связи с Мастером — изменение не отправлено. Подождите переподключения.');return}
  applyOp(op,p,d);hostConn.send({t:'w',op,p,d})}
const store={
  watchDoc(p,cb){const f=()=>cb(docs.has(p)?clone(docs.get(p)):null);queueMicrotask(f);return addL(dl,p,f)},
  watchCol(p,cb,q={}){const f=()=>{let a=[...docs].filter(([k])=>colOf(k)===p).map(([k,v])=>({id:k.split('/').pop(),...clone(v)}));if(q.order){a.sort((x,y)=>(x[q.order]>y[q.order]?1:-1)*(q.dir==='desc'?-1:1))}if(q.limit)a=a.slice(0,q.limit);cb(a)};queueMicrotask(f);return addL(cl,p,f)},
  set:async(p,d)=>write('set',p,d),update:async(p,d)=>write('update',p,d),del:async p=>write('del',p),
  newId:()=>Math.random().toString(36).slice(2,12),list:async c=>[...docs.keys()].filter(k=>colOf(k)===c).map(k=>k.split('/').pop())};

const names0={};names0[myId]=isOwner?myName+' (Мастер)':myName;
const evH=new Map(),peersH=new Set();let peerList=[],myPres={};
function deliverEv(topic,data,from){(evH.get(topic)||[]).forEach(f=>{try{f({topic,data,by:from,isMe:from===myId,sameTab:from===myId})}catch(e){}})}
function setPeers(list){if(!Array.isArray(list))return;for(const p of list)if(p&&p.id)names0[p.id]=String(p.name||'Игрок').slice(0,40);
  peerList=list.filter(p=>p&&p.id).map(p=>({peer:String(p.peer),by:p.id,isMe:p.id===myId,sameTab:p.peer===myPeer,presence:p.pres||{},guest:false,kind:'viewer',updatedAt:Date.now()}));
  peersH.forEach(f=>f({peers:peerList,joined:[],left:[],updated:[]}))}
function hostPeers(){return[{peer:'host',id:myId,name:names0[myId],pres:myPres},...[...conns.values()].filter(c=>c.id).map(c=>({peer:c.conn.peer,id:c.id,name:c.name,pres:c.pres}))]}
let peersT=0;function bcastPeers(){if(peersT)return;peersT=setTimeout(()=>{peersT=0;const l=hostPeers();setPeers(l);bcast({t:'peers',list:l})},40)}
let presT=0;
const room={
  on(t,f){if(!evH.has(t))evH.set(t,new Set());evH.get(t).add(f);return()=>evH.get(t).delete(f)},
  emit:async(topic,data)=>{if(isOwner){deliverEv(topic,data,myId);bcast({t:'ev',topic,data,from:myId})}else if(hostConn&&hostConn.open)hostConn.send({t:'ev',topic,data})},
  presence:async(patch)=>{for(const k in patch){if(patch[k]===null)delete myPres[k];else myPres[k]=patch[k]}
    if(presT)return;presT=setTimeout(()=>{presT=0;if(isOwner)bcastPeers();else if(hostConn&&hostConn.open)hostConn.send({t:'pres',pres:myPres})},50)},
  onPeers(f){peersH.add(f);queueMicrotask(()=>f({peers:peerList,joined:[],left:[],updated:[]}));return()=>peersH.delete(f)}};
const avCache={};
function avatar(n,id){if(avCache[id+n])return avCache[id+n];const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');let hh=0;for(const ch of String(id))hh=(hh*31+ch.charCodeAt(0))%360;
  x.fillStyle=`hsl(${hh},45%,38%)`;x.fillRect(0,0,48,48);x.fillStyle='#fff';x.font='bold 24px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText((String(n).trim()[0]||'?').toUpperCase(),24,26);return avCache[id+n]=c.toDataURL()}

    peer.on('error',e=>{if(e.type==='unavailable-id')netStatus(`Комната ${ROOM} уже открыта — в другой вкладке или у другого Мастера. Закройте лишнюю вкладку и обновите страницу.`);else if(e.type!=='peer-unavailable')netStatus('Сеть: '+e.type+'. Если игроки не подключаются — обновите страницу.')});
    peer.on('disconnected',()=>{setTimeout(()=>{try{if(!peer.destroyed)peer.reconnect()}catch(e){}},2000)});
    peer.on('connection',conn=>{conn.on('open',()=>{conns.set(conn.peer,{conn,id:null,name:'Игрок',pres:{}});const o={};for(const [k,v] of docs)if(!isPrivate(k))o[k]=v;conn.send({t:'snap',docs:o})});
      conn.on('data',m=>{const c=conns.get(conn.peer);if(!c||!m||typeof m!=='object')return;
        if(m.t==='hello'){c.id=String(m.id||'').slice(0,40)||conn.peer;c.name=String(m.name||'Игрок').slice(0,30);bcastPeers();deliverEv('joined',{name:c.name},c.id)}
        else if(m.t==='w'){if(!okPath(m.p))return;if(!applyOp(m.op,m.p,m.d))return;persist();bcast({t:'doc',p:m.p,d:docs.has(m.p)?docs.get(m.p):null})}
        else if(m.t==='ev'&&typeof m.topic==='string'&&m.topic!=='fogreset'){deliverEv(m.topic,m.data,c.id);bcast({t:'ev',topic:m.topic,data:m.data,from:c.id})}
        else if(m.t==='pres'&&m.pres&&typeof m.pres==='object'){c.pres=m.pres;bcastPeers()}});
      conn.on('close',()=>{conns.delete(conn.peer);bcastPeers()});conn.on('error',()=>{})})};
  open();
}else{
  let dialT=0;
  const dial=()=>{clearTimeout(dialT);if(hostConn&&hostConn.open)return;const c=peer.connect('smgla-'+ROOM,{reliable:true});hostConn=c;
    c.on('open',()=>{netStatus('');c.send({t:'hello',id:myId,name:myName})});
    c.on('data',m=>{if(!m||typeof m!=='object')return;
      if(m.t==='snap'&&m.docs){docs.clear();for(const k in m.docs)docs.set(k,m.docs[k]);fireAll()}
      else if(m.t==='doc'&&typeof m.p==='string'){if(m.d==null)docs.delete(m.p);else docs.set(m.p,m.d);fire(m.p)}
      else if(m.t==='ev')deliverEv(m.topic,m.data,m.from);
      else if(m.t==='peers')setPeers(m.list)});
    c.on('close',()=>{hostConn=null;netStatus('Связь с Мастером потеряна. Переподключаюсь…');dialT=setTimeout(dial,3000)})};
  peer=new Peer();myPeer=null;
  peer.on('open',id=>{myPeer=id;netStatus('Подключаюсь к столу '+ROOM+'…');dial()});
  peer.on('error',e=>{if(e.type==='peer-unavailable'){netStatus(`Мастер ещё не открыл стол ${ROOM}. Жду…`);dialT=setTimeout(dial,4000)}else netStatus('Сеть: '+e.type+'. Обновите страницу, если не подключится.')});
  peer.on('disconnected',()=>{setTimeout(()=>{try{if(!peer.destroyed)peer.reconnect()}catch(e){}},2000)});
}

/* ================= холст ================= */
const cv=$('cv'),g=cv.getContext('2d'),board=$('board');
let VW=0,VH=0,DPR=1;const cam={ox:0,oy:0,z:1};
let camTouched=false;

/* ================= видимость и свет ================= */
let lightDirty=true;const explored=new Map();let LC=null; // кэш: polys зрителей, источники света
const LS=m=>Math.min(1,1400/Math.max(m.w,m.h));
let darkCv=document.createElement('canvas'),fogCv=document.createElement('canvas'),visCv=document.createElement('canvas');
function segsFor(m){const md=S.maps[m.id]||{};const s=[];for(const w of md.walls||[]){if(w.d&&w.o)continue;s.push(w)}
  s.push({x1:0,y1:0,x2:m.w,y2:0},{x1:m.w,y1:0,x2:m.w,y2:m.h},{x1:m.w,y1:m.h,x2:0,y2:m.h},{x1:0,y1:m.h,x2:0,y2:0});return s}
function raySeg(px,py,dx,dy,s){const sx=s.x2-s.x1,sy=s.y2-s.y1,den=dx*sy-dy*sx;if(Math.abs(den)<1e-9)return Infinity;const ax=s.x1-px,ay=s.y1-py,t=(ax*sy-ay*sx)/den,u=(ax*dy-ay*dx)/den;return(t>=0&&u>=-1e-9&&u<=1+1e-9)?t:Infinity}
function visPoly(px,py,segs){const ang=[];for(const s of segs){for(const [x,y] of [[s.x1,s.y1],[s.x2,s.y2]]){const a=Math.atan2(y-py,x-px);ang.push(a-1e-4,a,a+1e-4)}}
  const out=[];for(const a of ang){const dx=Math.cos(a),dy=Math.sin(a);let b=Infinity;for(const s of segs){const t=raySeg(px,py,dx,dy,s);if(t<b)b=t}if(b<Infinity)out.push([a,px+dx*b,py+dy*b])}
  out.sort((u,v)=>u[0]-v[0]);return out}
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][1],yi=p[i][2],xj=p[j][1],yj=p[j][2];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
function pathPoly(c,p){c.beginPath();p.forEach((q,i)=>i?c.lineTo(q[1],q[2]):c.moveTo(q[1],q[2]));c.closePath()}
let previewTok=null; // Мастер смотрит глазами одного героя
function setPreview(on,tid){preview=!!on;previewTok=on?(tid||null):null;$('btnPreview').setAttribute('aria-pressed',String(preview));lightDirty=true;changed()}
function viewerTokens(){if(isGM())return null;if(preview&&previewTok&&S.tokens[previewTok])return[S.tokens[previewTok]];const here=tokList().filter(t=>t.map===st().map);const mine=here.filter(t=>t.owner&&t.owner===myId);return mine.length?mine:here.filter(t=>t.kind==='pc')}
function lightSources(m){const L=[];for(const t of tokList())if(t.map===m.id&&t.light>0&&(!t.hidden||isGM()))L.push({x:t.x,y:t.y,r:t.light});for(const l of (S.maps[m.id]||{}).lights||[])L.push({x:l.x,y:l.y,r:l.r});return L}
function buildLight(){
  const m=mapInfo(),s=LS(m),W=Math.ceil(m.w*s),H=Math.ceil(m.h*s),segs=segsFor(m),fp=ftPx(m);
  for(const c of[darkCv,fogCv,visCv])if(c.width!==W||c.height!==H){c.width=W;c.height=H}
  const amb=(S.maps[m.id]&&S.maps[m.id].amb!=null)?S.maps[m.id].amb:m.amb;
  const viewers=viewerTokens();const lights=lightSources(m).map(l=>({...l,poly:visPoly(l.x,l.y,segs)}));
  const vpolys=(viewers||[]).map(v=>({t:v,poly:visPoly(v.x,v.y,segs)}));
  const d=darkCv.getContext('2d');d.setTransform(1,0,0,1,0,0);d.clearRect(0,0,W,H);
  const showAmb=isGM()?amb*.45:amb;d.globalCompositeOperation='source-over';d.fillStyle=`rgba(0,0,0,${showAmb})`;d.fillRect(0,0,W,H);
  d.globalCompositeOperation='destination-out';d.setTransform(s,0,0,s,0,0);
  for(const l of lights){const R=l.r*fp*2,Rb=l.r*fp;d.save();pathPoly(d,l.poly);d.clip();const gr=d.createRadialGradient(l.x,l.y,0,l.x,l.y,R);gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(Rb/R,'rgba(0,0,0,1)');gr.addColorStop(Math.min(1,Rb/R+.05),'rgba(0,0,0,.55)');gr.addColorStop(1,'rgba(0,0,0,0)');d.fillStyle=gr;d.fillRect(l.x-R,l.y-R,R*2,R*2);d.restore()}
  for(const v of vpolys){const dv=(v.t.dv||0)*fp;if(dv<=0)continue;d.save();pathPoly(d,v.poly);d.clip();const gr=d.createRadialGradient(v.t.x,v.t.y,0,v.t.x,v.t.y,dv);gr.addColorStop(0,'rgba(0,0,0,.72)');gr.addColorStop(.85,'rgba(0,0,0,.6)');gr.addColorStop(1,'rgba(0,0,0,0)');d.fillStyle=gr;d.fillRect(v.t.x-dv,v.t.y-dv,dv*2,dv*2);d.restore()}
  d.globalCompositeOperation='source-over';
  const f=fogCv.getContext('2d');f.setTransform(1,0,0,1,0,0);f.clearRect(0,0,W,H);

/* ================= кубики ================= */
const rnd=n=>1+Math.floor(Math.random()*n);
function roll(expr,mode){const s=String(expr).replace(/\s+/g,'').replace(/к/gi,'d').toLowerCase();if(!/^[0-9d+\-]+$/.test(s)||!s)return null;
  const terms=s.match(/[+\-]?[^+\-]+/g)||[];let total=0,det=[],nat=null;
  for(let tm of terms){const sign=tm[0]==='-'?-1:1;tm=tm.replace(/^[+\-]/,'');const m=tm.match(/^(\d*)d(\d+)$/);
    if(m){const n=Math.min(50,Number(m[1]||1)),f=Number(m[2]);if(!f)return null;
      if(n===1&&f===20&&mode){const a=rnd(20),b=rnd(20),v=mode==='adv'?Math.max(a,b):Math.min(a,b);nat=v;total+=sign*v;det.push(`d20[${a},${b}→${v}]`)}
      else{const rs=Array.from({length:n},()=>rnd(f));if(n===1&&f===20)nat=rs[0];total+=sign*rs.reduce((x,y)=>x+y,0);det.push(`${sign<0?'−':''}${n}d${f}[${rs.join(',')}]`)}}
    else if(/^\d+$/.test(tm)){total+=sign*Number(tm);det.push((sign<0?'−':'+')+tm)}else return null}
  return{total,det:det.join(' '),nat}}
const critDice=e=>String(e).replace(/(\d*)d(\d+)/g,(a,n,f)=>(Number(n||1)*2)+'d'+f);
function whoAmI(){const t=myToken();return isOwner?'Мастер':(t?t.name:(names[myId]||'Игрок'))}
async function post(entry,secret){if(readOnly)return;const e={ts:Date.now(),who:whoAmI(),by:myId,...entry};if(secret&&isOwner){await store.set('gm/roll_'+store.newId('gm'),{...e,kind:'secret'})}else await store.set('log/'+store.newId('log'),e)}
async function rollPost(label,expr,opt={}){const r=roll(expr,opt.mode);if(!r){toast('Не понял формулу: '+expr);return null}
  await post({kind:'roll',text:label,expr,total:r.total,det:r.det+(opt.mode?(opt.mode==='adv'?' · с преимуществом':' · с помехой'):''),nat:r.nat,target:opt.target||null,dmg:opt.dmg??null},opt.secret);return r}
function toast(t){showBanner(t);clearTimeout(toast.t);toast.t=setTimeout(()=>showBanner(readOnly?$('banner').textContent:''),3500)}

/* ================= правила игры: урон, лечение, хиты монстров ================= */
const hpState=(hp,mx)=>hp<=0?'down':hp<=mx/2?'bloodied':hp<mx?'hurt':'ok';
async function applyHp(tid,amount,mode){const t=S.tokens[tid];if(!t)return;amount=Math.max(0,Math.floor(amount));
  if(t.kind==='monster'){const m=S.gm[tid];if(!m||!isOwner)return;let hp=mode==='heal'?Math.min(m.hpMax,m.hp+amount):m.hp-amount;hp=Math.max(0,hp);await store.update('gm/mon_'+tid,{hp});await store.update('tokens/'+tid,{hpState:hpState(hp,m.hpMax)});
    await post({kind:'sys',text:`${t.name}: ${mode==='heal'?'+':'−'}${amount} хитов${hp<=0?' — повержен':''}`});return}
  let hp=t.hp,tmp=t.hpTemp||0;
  if(mode==='heal'){hp=Math.min(t.hpMax,Math.max(0,hp)+amount);await store.update('tokens/'+tid,{hp,ds:0,df:0});await post({kind:'sys',text:`${t.name} лечится на ${amount} → ${hp}/${t.hpMax}`});return}
  if(mode==='temp'){await store.update('tokens/'+tid,{hpTemp:Math.max(tmp,amount)});return}
  const absorb=Math.min(tmp,amount);tmp-=absorb;let rest=amount-absorb;let note='';

function gameContext(){const s=st(),m=mapInfo();const here=tokList().filter(t=>t.map===m.id);
  const lines=[`Карта: ${m.name}. ${s.combat.on?`Идёт бой, раунд ${s.combat.round}, ходит: ${(S.tokens[s.combat.turn]||{}).name||'—'}.`:'Боя нет.'}`];
  for(const t of here){const c=S.chars[t.id];const g2=S.gm[t.id];lines.push(`- ${t.name} (${t.kind==='monster'?t.monster:t.kind==='pc'?'герой':'союзник'}${c&&c.cls?', '+c.cls+' '+(c.lvl||''):''}): ${t.kind==='monster'&&g2?`ХП ${g2.hp}/${g2.hpMax}, КД ${g2.ac}`:`ХП ${t.hp}/${t.hpMax}, КД ${t.ac}`}${(t.cond||[]).length?', состояния: '+t.cond.join(', '):''}${t.init!=null?', инициатива '+t.init:''}`)}
  const sl=sel&&S.tokens[sel];if(sl)lines.push('Выбрана фишка: '+sl.name);return lines.join('\n').slice(0,6000)}
async function askAI(q){if(!sample||aiBusy||!q.trim())return;aiErr='';aiTurns.push({role:'user',content:q.trim().slice(0,1500)});aiTurns.push({role:'assistant',content:''});aiBusy=true;renderPane(true);
  aiCtl=new AbortController();const hist=aiTurns.slice(0,-1).slice(-12);
  try{const r=await sample([{role:'user',content:AI_RULES+'\n\nСостояние стола сейчас:\n'+gameContext()},...(hist[0]&&hist[0].role==='assistant'?hist.slice(1):hist)],{cache:false,signal:aiCtl.signal,onText:({text})=>{aiTurns[aiTurns.length-1].content=text;const el=document.getElementById('ai-last');if(el)el.textContent=text}});
    aiTurns[aiTurns.length-1].content=r.text}
  catch(e){const last=aiTurns[aiTurns.length-1];last.content=e.text||'';if(e.code!=='cancelled')aiErr={not_granted:'Помощник выключен: доступ к Claude не разрешён.',rate_limited:'Слишком много вопросов подряд — попробуйте через минуту.',refused:'Claude не стал отвечать на этот вопрос. Переформулируйте.'}[e.code]||'Не получилось получить ответ. Попробуйте ещё раз.';if(!last.content)aiTurns.splice(-2,2)}
  finally{aiBusy=false;aiCtl=null;renderPane(true)}}
function paneAI(){const out=[h('h3',{},'Правила · помощник Мастера')];
  if(!sample){out.push(h('p',{class:'muted'},'Помощник отвечает только в версии стола на claude.ai (там он работает от вашего аккаунта Claude). Откройте её в соседней вкладке — вопросы можно задавать параллельно с игрой здесь.'),h('a',{class:'btn pri',href:'https://claude.ai/artifact/BGNpXLhKdKXD33Hw1RWX3i',target:'_blank',rel:'noopener'},'Открыть помощника на claude.ai'));return out}
  out.push(h('p',{class:'small muted'},'Спросите, что можно и чего нельзя по Книге игрока 2014. Помощник видит, кто стоит на карте, хиты и состояния. Первый вопрос попросит разрешения на использование Claude.'));
  const QUICK=['Можно ли атаковать двумя оружиями?','Как работает захват?','Что даёт укрытие?','Как работает концентрация?','Что можно сделать бонусным действием?','Как работает невидимость в бою?'];
  out.push(h('div',{},QUICK.map(q=>h('span',{class:'tag',role:'button',tabindex:0,onclick:()=>askAI(q)},q))));
  const qa=h('div',{});for(let i=0;i<aiTurns.length;i+=2){qa.append(h('div',{class:'ai-q'},'❓ '+aiTurns[i].content));const a=aiTurns[i+1];qa.append(h('div',{class:'ai-a',id:i+2>=aiTurns.length?'ai-last':null},a&&a.content?a.content:(aiBusy?'Думаю…':'')))}
  out.push(qa);if(aiErr)out.push(h('p',{class:'small',style:'color:var(--danger)'},aiErr));
  const ta=h('textarea',{rows:3,placeholder:'Например: «Может ли плут спрятаться за союзником?»','aria-label':'Вопрос по правилам'});ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=ta.value;ta.value='';askAI(v)}};
  out.push(h('div',{style:'margin-top:10px'},ta),h('div',{class:'row',style:'margin-top:6px'},aiBusy?h('button',{class:'btn bad',type:'button',onclick:()=>aiCtl&&aiCtl.abort()},'Остановить'):h('button',{class:'btn pri',type:'button',onclick:()=>{const v=ta.value;ta.value='';askAI(v)}},'Спросить'),aiTurns.length?h('button',{class:'btn sm',type:'button',onclick:()=>{aiTurns=[];renderPane(true)}},'Новый разговор'):null));
  return out}

/* ================= старт ================= */
if(!LIVE)showBanner('Демо-режим: изменения видны только вам. Чтобы играть вместе, откройте стол на claude.ai под своим аккаунтом.');
else if(!canWrite){readOnly=true;showBanner('У вас доступ только для просмотра. Попросите Мастера дать вам доступ «Редактор».')}
if(!isOwner)tab='hero';
renderTabs();resize();fitMap();changed();
window.__table={S,st,frame:()=>draw()};
})();
</script>

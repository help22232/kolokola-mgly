<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Стол Солёной Мглы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: игровой стол — карта на всю ширину слева, справа (на телефоне снизу) панель с вкладками: бой, герой, вещи, кубики, мастер, правила. Один тёмный образ, как ночная таверна: карта должна быть главной. */
:root{
  --bg:#0a0e0f; --panel:#111819; --panel2:#162022; --ink:#e3ebe8; --muted:#8e9e9b; --line:#243235;
  --sea:#8fd1c4; --brass:#d9b36c; --danger:#e58a80; --ok:#8fcf8a; --warn:#e8c46a;
  --f-display:"Alegreya SC", Georgia, serif;
  --f-body:"Alegreya Sans", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:15px;line-height:1.4;overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);}
header.top{display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
header .ttl{font-family:var(--f-display);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
header .chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
header .chip.gm{color:var(--brass);border-color:rgba(217,179,108,.5)}
header .chip.round{color:var(--danger);border-color:rgba(229,138,128,.5)}
header .sp{flex:1}
.peers{display:flex;gap:-4px}
.peers img{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);margin-left:-6px;background:#333}
.main{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0}
.board{position:relative;min-width:0;min-height:0;background:#050707;touch-action:none;overflow:hidden}
.board canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.board canvas.tool{cursor:crosshair}
.tools{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px;z-index:2;max-height:calc(100% - 76px)}
.tools button,.zoom button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:rgba(17,24,25,.9);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.tools button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:#231d10}
.tools button:focus-visible,.zoom button:focus-visible{outline:2px solid var(--sea)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:2}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(17,24,25,.92);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted);z-index:2;max-width:calc(100% - 120px);text-align:center}
.banner{position:absolute;left:10px;right:10px;bottom:56px;background:rgba(35,29,16,.95);border:1px solid rgba(217,179,108,.5);color:var(--brass);border-radius:8px;padding:6px 10px;font-size:13px;z-index:2}
aside.panel{display:grid;grid-template-rows:auto minmax(0,1fr);border-left:1px solid var(--line);background:var(--panel);min-height:0;min-width:0}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{flex:1 0 auto;padding:9px 10px;border:0;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.tabs button:focus-visible{outline:2px solid var(--sea);outline-offset:-2px}
.pane{overflow:auto;padding:12px 14px 40px;min-height:0}
h3{font-family:var(--f-display);font-weight:500;font-size:19px;margin:14px 0 6px}
h3:first-child{margin-top:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover,.btn:focus-visible{border-color:var(--sea);outline:none}
.btn.pri{border-color:rgba(217,179,108,.6);color:var(--brass)}
.btn.bad{border-color:rgba(229,138,128,.5);color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
input[type=text],input[type=number],select,textarea{background:#0c1213;border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
input[type=number]{width:64px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sea)}
textarea{width:100%;resize:vertical}
label.f{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);margin:8px 0}
.ini{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:9px;margin:5px 0;cursor:pointer;background:var(--panel2)}
.ini.cur{border-color:var(--brass);background:#231d10}
.ini .n{font-family:var(--f-mono);font-size:15px;text-align:center;color:var(--brass);font-variant-numeric:tabular-nums}
.ini .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ini .sub{font-size:12px;color:var(--muted)}
.hpbar{height:5px;border-radius:3px;background:#2a1a18;overflow:hidden;margin-top:3px}
.hpbar i{display:block;height:100%}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.stat{border:1px solid var(--line);border-radius:8px;text-align:center;padding:5px 2px;background:#0c1213;cursor:pointer}
.stat b{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.05em}
.stat input{width:100%;text-align:center;border:0;background:none;padding:2px 0;font-size:16px}
.stat .md{font-family:var(--f-mono);font-size:12px;color:var(--sea)}
.tag{display:inline-block;font-size:12px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);margin:2px;cursor:pointer;color:var(--muted)}
.tag[aria-pressed="true"]{color:var(--danger);border-color:rgba(229,138,128,.6)}
.log{display:flex;flex-direction:column;gap:6px}
.msg{border-left:3px solid var(--line);padding:3px 0 3px 8px}
.msg.roll{border-left-color:var(--sea)}
.msg.secret{border-left-color:var(--brass);background:#1b170d}
.msg.sys{border-left-color:var(--muted);color:var(--muted)}
.msg .who{font-size:12px;color:var(--muted)}
.msg .tot{font-family:var(--f-mono);font-size:18px;color:var(--ink)}
.msg .det{font-family:var(--f-mono);font-size:12px;color:var(--muted);word-break:break-word}
.dice{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dice button{padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-family:var(--f-mono)}
.inv td,.inv th{padding:4px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.inv th{font-size:11px;color:var(--muted);font-weight:500}
.inv{width:100%;border-collapse:collapse}
.ai-a{white-space:pre-wrap;line-height:1.5}
.ai-q{color:var(--brass);margin-top:12px;font-weight:500}
.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
.pp{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:6px}
.pp button{display:grid;justify-items:center;gap:3px;padding:6px 2px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);cursor:pointer;font-size:11px;color:var(--muted);line-height:1.15}
.pp button[aria-pressed="true"]{border-color:var(--brass);color:var(--ink);background:#231d10}
.pp .ava{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #d9b36c}
.pp .ava img{width:30px;height:30px}
details>summary{cursor:pointer;color:var(--sea);margin-top:8px}
.credit{font-size:11px;color:var(--muted);margin-top:18px}
.zoom button[aria-pressed="true"]{border-color:var(--brass);background:#231d10}
.notepop{position:absolute;z-index:5;width:min(300px,calc(100% - 20px));background:var(--panel);border:1px solid var(--brass);border-radius:10px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.notepop textarea{min-height:70px}
.notepop .who{font-size:12px;color:var(--muted);margin-bottom:4px}
.notepop .txt{white-space:pre-wrap;margin:4px 0 8px}
.mist{display:flex;align-items:center;gap:6px;cursor:pointer;background:none}
.mist .cells{display:flex;gap:2px}
.mist .cells i{width:7px;height:12px;border-radius:2px;background:#26383a}
.mist .cells i.on{background:#7fd0a8}
.mist .cells i.on.hi{background:#e8c46a}
.mist .cells i.on.max{background:#e58a80}
.mistbox{display:flex;align-items:center;gap:10px;margin:6px 0}
.mistbox .cells{display:flex;gap:4px}
.mistbox .cells i{width:22px;height:22px;border-radius:5px;background:#26383a;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;color:var(--muted)}
.mistbox .cells i.on{background:#2f6f5c;color:#fff}
.mistbox .cells i.on.hi{background:#8a6d22}
.mistbox .cells i.on.max{background:#8a3a33}
.csov{position:fixed;inset:0;z-index:50;background:#000}
.csov iframe{width:100%;height:100%;border:0;display:block}
#csClose{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 12px);z-index:2;opacity:.8}
#handov{background:var(--bg)}
.hand-box{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);padding-top:env(safe-area-inset-top,0px)}
.hand-bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel)}
.hand-view{overflow:auto}
.hand-view img{display:block;max-width:none;margin:0 auto}
.lobby{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:rgba(5,8,9,.88);padding:16px}
.lobby.gm{inset:10px 10px auto auto;width:min(340px,calc(100% - 120px));background:none;padding:0;display:flex;justify-content:flex-end;align-items:flex-start}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:440px;width:100%;max-height:100%;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.lobby.pl{position:fixed;inset:0;z-index:30;display:block;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:var(--bg);
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 96px) max(16px,env(safe-area-inset-left,0px))}
.lobby.pl .lcard{margin:0 auto 14px;max-height:none;overflow:visible;box-shadow:none}
.lobby.pl .readybar{position:fixed;left:0;right:0;bottom:0;z-index:31;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-top:1px solid var(--line)}
.lobby.pl .readybar .btn{width:100%;max-width:440px;display:block;margin:0 auto;padding:14px;font-size:17px}
.lobby.mini{position:fixed;inset:auto 0 0 0;z-index:30;display:block;background:none;padding:0}
.net{font-size:13px;padding:6px 10px;border-radius:8px;margin:8px 0}
.net.ok{background:rgba(143,207,138,.12);color:var(--ok)}
.net.bad{background:rgba(229,138,128,.14);color:var(--danger)}
.lrow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
#toolsToggle[hidden]{display:none}
.tools.collapsed button[data-tool]:not(.cur):not([data-tool="select"]),.tools.collapsed #btnPreview:not(.cur){display:none}
.hint{cursor:pointer}
.rollfx{position:absolute;right:10px;top:10px;z-index:4;display:flex;flex-direction:column;gap:6px;width:min(300px,calc(100% - 70px));pointer-events:none}
.rcard{pointer-events:auto;display:flex;gap:10px;align-items:center;background:rgba(17,24,25,.95);border:1px solid var(--line);border-left:4px solid #d9b36c;border-radius:10px;padding:7px 10px;box-shadow:0 6px 18px rgba(0,0,0,.45);animation:rin .25s ease-out;transition:opacity .4s,transform .4s;cursor:pointer}
.rcard.out{opacity:0;transform:translateX(30px)}
.rcard.conc{border-left-color:#8fb4ff}.rcard.oa{border-left-color:#f0c050}.rcard .btn.sm{min-height:32px}
.rcard.crit{border-left-color:#7fd68a;background:rgba(20,40,26,.96)}.rcard.fail{border-left-color:#e5786f;background:rgba(44,20,20,.96)}
.rtot{font:700 28px/1 'IBM Plex Mono',monospace;color:#ffe6a0;min-width:42px;text-align:center}
.rcard.crit .rtot{color:#9cf0a6}.rcard.fail .rtot{color:#ff9a90}
.rtxt{min-width:0;font-size:13px;line-height:1.3}.rtxt b{display:block;overflow:hidden;text-overflow:ellipsis}
.rdmg{color:#ff9a90;font-weight:700}.rdet{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fnum{position:absolute;z-index:4;transform:translate(-50%,-50%);font:800 26px/1 'IBM Plex Mono',monospace;pointer-events:none;text-shadow:0 0 4px #000,0 2px 6px #000;animation:fup 1.9s ease-out forwards}
.fnum.dmg{color:#ff6b5e}.fnum.heal{color:#7fe08c}
@keyframes fup{0%{opacity:0;margin-top:0;scale:.6}12%{opacity:1;scale:1.25}25%{scale:1}100%{opacity:0;margin-top:-60px}}
@keyframes rin{from{opacity:0;transform:translateY(-10px)}}
@media (max-width:820px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,62fr) minmax(0,38fr)}
  #roleChip{max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs button{flex:0 0 auto;padding:9px 12px}
  .tools button,.zoom button{width:40px;height:40px}
  .hint{top:auto;bottom:62px;font-size:12px;max-width:calc(100% - 24px)}
  .rollfx{top:6px;left:56px;right:56px;width:auto;align-items:center}.rcard{width:100%;max-width:260px}.rcard{padding:5px 8px}.rtot{font-size:22px;min-width:34px}.rdet{display:none}
  .banner{font-size:12px;padding:4px 8px;bottom:58px}
  .pane{padding:10px 12px 30px}
  aside.panel{border-left:0;border-top:1px solid var(--line)}
  header .ttl{display:none}
  header.top{gap:6px}
  .mist>span:first-child{display:none}
  .peers img{width:20px;height:20px}
  .hide-m{display:none}
}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="ttl" id="ttl">Колокола Солёной Мглы</div>
    <span class="chip hide-m" id="mapChip">—</span>
    <span class="chip round" id="roundChip" hidden>Раунд 1</span>
    <span class="sp"></span>
    <button class="chip mist" id="mistChip" type="button" title="Шкала Мглы"><span>Мгла</span><span class="cells" id="mistCells"></span></button>
    <button class="chip" id="btnMaps" type="button" hidden>🗺 Карты</button>
    <div class="peers" id="peers"></div>
    <span class="chip" id="roleChip">…</span>
  </header>
  <div class="main">
    <section class="board" id="board">
      <canvas id="cv"></canvas>
      <div class="tools" id="tools" hidden>
        <button type="button" data-tool="select" title="Выбор и перемещение" aria-pressed="true">✋</button>
        <button type="button" class="gmo" data-tool="wall" title="Стены (клик — точка, двойной клик — конец)">▰</button>
        <button type="button" class="gmo" data-tool="door" title="Дверь (два клика)">🚪</button>
        <button type="button" class="gmo" data-tool="light" title="Источник света (клик)">💡</button>
        <button type="button" class="gmo" data-tool="reveal" title="Открыть игрокам скрытое место (тайный ход, дверь, тайник)">🗝</button>
        <button type="button" class="gmo" data-tool="dark" title="Магическая тьма (клик — круг, клик по нему — убрать)">🌑</button>
        <button type="button" class="gmo" data-tool="erase" title="Ластик: стены, двери, свет, открытые места">⌫</button>
        <button type="button" class="gmo" id="btnPreview" title="Смотреть как игроки" aria-pressed="false">👁</button>
      </div>
      <div class="hint" id="hint" hidden></div>
      <div class="banner" id="banner" hidden></div>
      <div class="lobby" id="lobby" hidden></div>
      <div class="notepop" id="notepop" hidden></div>
      <div class="zoom">
        <button type="button" id="zoomOut" title="Отдалить">−</button>
        <button type="button" id="zoomIn" title="Приблизить">+</button>
        <button type="button" id="zoomMe" title="К моему герою">◎</button>
        <button type="button" id="btnNote" title="Заметка на карте: нажмите, потом коснитесь места" aria-pressed="false">📝</button>
      </div>
    </section>
    <aside class="panel">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="pane" id="pane"></div>
    </aside>
  </div>
</div>
<div class="csov" id="csov" hidden><iframe id="csFrame" title="Катсцена" allow="autoplay; fullscreen"></iframe><button class="btn" id="csClose" type="button">✕ Закрыть</button></div>
<div class="csov" id="handov" hidden></div>
<div id="modov"></div>
<div class="csov" id="luov" hidden style="background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(14px,env(safe-area-inset-right,0px)) 40px max(14px,env(safe-area-inset-left,0px))"><div id="luBox" style="max-width:640px;margin:0 auto"></div></div>

<script src="herocode.js"></script>
<script src="levelup.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(async function(){
"use strict";
/* ================= справочники ================= */
const MAPS=[
  {id:'01-region',outdoor:1,name:'Бухта Солёной Мглы',src:'maps/01-region.svg',w:1400,h:1000,grid:0,amb:0},
  {id:'02-solthaven',outdoor:1,name:'Солтхейвен',src:'maps/02-solthaven.svg',w:1400,h:1000,grid:0,amb:.45},
  {id:'03-grot-bochek',name:'Грот Бочек',src:'maps/03-grot-bochek.svg',w:1440,h:1210,grid:40,amb:.85},
  {id:'04-mayak',outdoor:1,name:'Маяк Седой Бран',src:'maps/04-mayak.svg',w:1440,h:1000,grid:40,amb:.6},
  {id:'05-paluba-tsapli',outdoor:1,name:'Палуба «Цапли»',src:'maps/05-paluba-tsapli.svg',w:1440,h:760,grid:40,amb:.1},
  {id:'06-monastyr-otliva',outdoor:1,name:'Монастырь Отлива',src:'maps/06-monastyr-otliva.svg',w:1600,h:1200,grid:40,amb:.25},
  {id:'07-sklep-kolokola',name:'Склеп Серебряного колокола',src:'maps/07-sklep-kolokola.svg',w:1200,h:960,grid:40,amb:.9},
  {id:'08-is-merin',name:'Ис-Мерин',src:'maps/08-is-merin.svg',w:1600,h:1200,grid:40,amb:.5},
  {id:'09-kolokolnaya-bashnya',name:'Колокольная башня',src:'maps/09-kolokolnaya-bashnya.svg',w:1440,h:1080,grid:40,amb:.65},

function roll(expr,mode){const s=String(expr).replace(/\s+/g,'').replace(/к/gi,'d').toLowerCase();if(!/^[0-9d+\-]+$/.test(s)||!s)return null;
  const terms=s.match(/[+\-]?[^+\-]+/g)||[];let total=0,det=[],nat=null;
  for(let tm of terms){const sign=tm[0]==='-'?-1:1;tm=tm.replace(/^[+\-]/,'');const m=tm.match(/^(\d*)d(\d+)$/);
    if(m){const n=Math.min(50,Number(m[1]||1)),f=Number(m[2]);if(!f)return null;
      if(n===1&&f===20&&mode){const a=rnd(20),b=rnd(20),v=mode==='adv'?Math.max(a,b):Math.min(a,b);nat=v;total+=sign*v;det.push(`d20[${a},${b}→${v}]`)}
      else{const rs=Array.from({length:n},()=>rnd(f));if(n===1&&f===20)nat=rs[0];total+=sign*rs.reduce((x,y)=>x+y,0);det.push(`${sign<0?'−':''}${n}d${f}[${rs.join(',')}]`)}}
    else if(/^\d+$/.test(tm)){total+=sign*Number(tm);det.push((sign<0?'−':'+')+tm)}else return null}
  return{total,det:det.join(' '),nat}}

/* ---- ИИ: ПРАВИЛА ---- */
const AI_RULES=`Ты — помощник Мастера в настольной игре Dungeons & Dragons 5-й редакции. Мастер ведёт игру прямо сейчас и спрашивает тебя, когда игроки задают вопросы по правилам («можно ли так?», «что даёт это состояние?», «как это работает?»).
Основа правил — Книга игрока 2014 года, Руководство Мастера 2014 и Бестиарий 2014 (НЕ редакция 2024). Если в 2024 правило иное, можешь коротко упомянуть разницу, но решай по 2014.
Отвечай по-русски, коротко и по делу, чтобы Мастер мог прочитать за 15 секунд. Формат:
**Коротко:** да / нет / можно, но… — одна фраза.
**По правилам:** 2–4 предложения, сослись на главу и раздел Книги игрока 2014 (например «гл. 9 „Бой“, раздел „Укрытие“»). Не выдумывай номера страниц.
**За столом:** что конкретно сделать — какой бросок, какая СЛ, преимущество или помеха, сколько стоит действие (действие, бонусное действие, реакция, перемещение).
Если правило спорное или не описано, скажи прямо и предложи справедливое решение Мастера. Если вопрос про героя или монстра на столе, используй данные ниже.
Особенности этой кампании («Колокола Солёной Мглы»): Шкала Мглы 0–6 (на 3+ в начале длинного отдыха спасбросок Мудрости СЛ 11 или 1 уровень истощения); компаньон Тамси (КД 14, ХП 7×уровень, атака +4, 1d6+2, бесплатное действие Помощь); восковые затычки дают преимущество на спасброски от звона колоколов и помеху на Внимательность на слух; Жемчужина Дыхания держит воздух для всех в 30 фт; Вейра Тиш при 0 ХП возвращается через раунд с 40 ХП, пока не перерублены три цепи Великого колокола (КД 15, 25 ХП каждая).`;

  return out}
